name: mama_meow
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.19
environment:
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^2.0.0
  get_storage: ^2.1.1
  intl: ^0.20.2
  crypto: ^3.0.6 # Apple Sign-In nonce (sha256)
  rxdart: ^0.28.0
  path_provider: ^2.1.5
  path: ^1.9.1
  mime: ^2.1.0
  image: ^4.12.0 # AI'a gönderilmeden önce görsel format dönüşümü

  # Firebase — 4.x hattı (iOS SDK 12.19): FlutterFire 5 / iOS SDK 13, SPM'de
  # google_sign_in_ios'un GoogleSignIn 9 bağımlılığıyla çakışıyor
  # (gtm-session-fetcher 4+ vs <4). google_sign_in_ios GoogleSignIn 10'a
  # geçince yükseltin.
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_database: ^12.6.0
  firebase_analytics: ^12.6.0
  firebase_crashlytics: ^5.4.0
  firebase_storage: ^13.6.0
  cloud_functions: ^6.5.0 # OpenAI proxy (sunucu tarafı callable)

  # Kimlik doğrulama
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0

  # Ödeme & büyüme
  purchases_flutter: ^10.16.0
  in_app_review: ^2.0.10
  share_plus: ^13.3.1
  url_launcher: ^6.3.3

  # UI
  go_router: ^18.1.0
  cached_network_image: ^4.0.3
  flutter_svg: ^2.2.1
  syncfusion_flutter_charts: ^34.1.29

  # Medya
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  image_picker: ^1.2.4
  flutter_image_compress: ^2.5.1
  record: ^7.1.2

  # Bildirimler
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

  # Raporlar
  pdf: ^3.13.1

  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0

# Uygulama ikonu (Coo Care ay + bebek). iOS'ta asıl ikon Icon Composer dosyası
# ios/Runner/AppIcon.icon'dur (iOS 26 Liquid Glass, koyu/şeffaf/tinted görünümler;
# Xcode eski iOS sürümlerinin ikonlarını da ondan üretir). Aşağıdaki iOS çıktısı
# (AppIcon.appiconset) yalnızca Xcode 26 öncesiyle derlemeler için yedektir.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  adaptive_icon_background: "#FFFFFF" # Android 8+
  # Figür zaten 66dp güvenli dairenin içine yerleştirildi, ek boşluk yok.
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/icon/app_icon_monochrome.png" # Android 13+ temalı ikon
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#ffffff"



dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4



  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  config:
    # iOS bağımlılıkları CocoaPods yerine Swift Package Manager ile gelir
    # (Firebase Ekim 2026'dan sonra CocoaPods'a yayın yapmıyor). Proje
    # ayarı, makinedeki global `flutter config` değerini ezer.
    enable-swift-package-manager: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/foods/
    - assets/fonts/
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/nunito/Nunito-Regular.ttf
        - asset: assets/fonts/nunito/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/nunito/Nunito-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/nunito/Nunito-Italic.ttf
          style: italic
        - asset: assets/fonts/nunito/Nunito-Black.ttf
          weight: 900
        - asset: assets/fonts/nunito/Nunito-BlackItalic.ttf
          weight: 900
          style: italic
        - asset: assets/fonts/nunito/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/nunito/Nunito-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/nunito/Nunito-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/nunito/Nunito-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/nunito/Nunito-Light.ttf
          weight: 300
        - asset: assets/fonts/nunito/Nunito-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/nunito/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/nunito/Nunito-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/nunito/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/nunito/Nunito-SemiBoldItalic.ttf
          weight: 600
          style: italic
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
