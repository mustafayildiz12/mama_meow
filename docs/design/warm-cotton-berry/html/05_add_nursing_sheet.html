<textarea class="w-full rounded-[16px] border border-hairline bg-cotton-white p-3 font-body-md text-body-md text-deep-charcoal placeholder-charcoal-soft focus:outline-none focus:border-active-berry focus:ring-1 focus:ring-active-berry resize-none transition" id="nursing-notes" placeholder="Add a note…" rows="2"></textarea>
</section>
